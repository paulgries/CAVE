name: CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/ci.yml'

jobs:
  backend-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-env

      - name: Run backend tests
        run: npm run test --workspace @cave/backend

  web-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-env

      - name: Run lint
        run: npm run lint --workspace @cave/web

      - name: Run type check
        run: npm run type-check --workspace @cave/web

      - name: Run unit tests
        run: npm run test:unit --workspace @cave/web

  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-env

      - name: Run lint
        run: npm run lint

      - name: Run format check
        run: npm run format:check
